<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/main.css" />
    <title>JavaScript Homework Console Portfolio</title>
  </head>
  <body>
    <main class="container">
      <h2>Select a JavaScript homework to execute:</h2>

      <div class="controls">
        <select id="hw-select">
          <option value="">-- Choose Homework --</option>
          <option value="hw1">Homework 1: Variable Declaration</option>
          <option value="hw2">Homework 2: Value Reassignment</option>
          <option value="hw3">Homework 3: Numbers Multiplication</option>
          <option value="hw4">Homework 4: Strings Concatenation</option>
          <option value="hw5">Homework 5: Comments</option>
          <option value="hw6">Homework 6: Data Types</option>
          <option value="hw7">Homework 7: Regular Function</option>
          <option value="hw8">Homework 8: Function Expression</option>
        </select>
      </div>

      <div class="terminal" id="terminal">
        <div class="line system">
          [System]: Console initialized. Please select a homework script
          above...
        </div>
      </div>
    </main>
    <script src="./script/main.js"></script>
  </body>
</html>
