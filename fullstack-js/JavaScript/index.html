<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/main.css" />
    <title>JavaScript Homework Console Portfolio</title>
  </head>
  <body>
    <main class="container">
      <h2>Select a JavaScript homework to execute:</h2>

      <div class="controls">
        <select id="hw-select">
          <option value="">-- Choose Homework --</option>
          <option value="hw1">
            Homework 1: Variables. Data Types. Operators (ДЗ 18.1)
          </option>
          <option value="hw2">Homework 2: Math. String (ДЗ 19.1)</option>
          <option value="hw3">
            Homework 3: if else. Loops. Functions (ДЗ 20.1)
          </option>
          <option value="hw4">
            Homework 4: Functional Programming. Currying. Closures. HoF (ДЗ
            21.1)
          </option>
          <option value="hw5">
            Homework 5: Closures. Recursion. Methods apply & bind (ДЗ 22.1)
          </option>
          <option value="hw6">Homework 6: Classes. Map. Set (ДЗ 23.1)</option>
          <option value="hw7">Homework 7: Arrays. Date (ДЗ 24.1)</option>
          <option value="hw8">
            Homework 8: DOM. Cookie. Session Storage (ДЗ 25.1)
          </option>
          <option value="hw9">Homework 9: Events (ДЗ 26.1)</option>
        </select>
      </div>

      <div class="terminal" id="terminal">
        <div class="line system">
          [System]: Console initialized. Please select a homework script
          above...
        </div>
      </div>
    </main>
    <script src="./script/main.js"></script>
  </body>
</html>
