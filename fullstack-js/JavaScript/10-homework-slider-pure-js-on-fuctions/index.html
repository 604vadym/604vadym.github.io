<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <title>Slider. Pure JavaScript on functions</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="slider">
        <div class="slider__viewport">
          <div class="slider__track">
            <div class="slider__slide">
              <div class="image slider__image">
                <img
                  class="image__img"
                  src="./assets/images/Asura-2000-Code-Eternity.jpg"
                  alt="Asura - Code Eternity (2000)"
                />
              </div>
            </div>
            <div class="slider__slide">
              <div class="image slider__image">
                <img
                  class="image__img"
                  src="./assets/images/Asura-2002-Lost-Eden.jpg"
                  alt="Asura - Lost Eden (2002)"
                />
              </div>
            </div>
            <div class="slider__slide">
              <div class="image slider__image">
                <img
                  class="image__img"
                  src="./assets/images/Asura-2007-Life².jpg"
                  alt="Asura - Life² (2007)"
                />
              </div>
            </div>
            <div class="slider__slide">
              <div class="image slider__image">
                <img
                  class="image__img"
                  src="./assets/images/Asura-2010-360.jpg"
                  alt="Asura - 360 (2010)"
                />
              </div>
            </div>
          </div>
        </div>

        <nav class="slider__nav">
          <button class="button slider__btn slider__btn--next" type="button">
            <svg aria-hidden="true" viewBox="0 0 1024 1024" role="img">
              <path
                d="M355 172l303 303-303 304q-11 11-11 26t11 25l95 95q11 11 25 11t26-11l422-424q11-11 11-26t-11-25L516 26q-11-11-26-11t-25 11l-95 95q-11 10-11 25t11 26z"
              ></path>
            </svg>
          </button>
          <button class="button slider__btn slider__btn--prev" type="button">
            <svg aria-hidden="true" viewBox="0 0 1024 1024" role="img">
              <path
                d="M669 172L366 475l303 304q11 11 11 26t-11 25l-95 95q-11 11-25 11t-26-11L99 501q-11-11-11-26t11-25L523 26q11-11 26-11t25 11l95 95q11 10 11 25t-11 26z"
              ></path>
            </svg>
          </button>

          <div class="pagination slider__pagination"></div>
        </nav>

        <button class="button slider__btn slider__btn--pause">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-pause-fill"
            viewBox="0 0 16 16"
          >
            <path
              d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5m5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5"
            />
          </svg>
        </button>
      </div>
    </div>
    <script src="./script/main.js"></script>
  </body>
</html>
