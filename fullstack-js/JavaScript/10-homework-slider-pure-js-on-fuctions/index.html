<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <title>
      Smart adaptive slider-showcase-player. Pure JavaScript on functions
    </title>
  </head>
  <body>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      style="display: none"
      aria-hidden="true"
    >
      <symbol id="icon-play" viewBox="0 0 16 16">
        <path
          d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"
        />
      </symbol>

      <symbol id="icon-pause" viewBox="0 0 16 16">
        <path
          d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5m5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5"
        />
      </symbol>

      <symbol id="icon-arrow-left" viewBox="0 0 1024 1024">
        <path
          d="M669 172L366 475l303 304q11 11 11 26t-11 25l-95 95q-11 11-25 11t-26-11L99 501q-11-11-11-26t11-25L523 26q11-11 26-11t25 11l95 95q11 10 11 25t-11 26z"
        ></path>
      </symbol>

      <symbol id="icon-arrow-right" viewBox="0 0 1024 1024">
        <path
          d="M355 172l303 303-303 304q-11 11-11 26t11 25l95 95q11 11 25 11t26-11l422-424q11-11 11-26t-11-25L516 26q-11-11-26-11t-25 11l-95 95q-11 10-11 25t11 26z"
        ></path>
      </symbol>
    </svg>

    <div class="wrapper">
      <div class="slider" role="region" aria-label="Asura showcase slider">
        <div class="slider__viewport js-autoscroll-pause">
          <div class="slider__track">
            <div class="slider__slide">
              <div class="image slider__image">
                <img
                  class="image__img"
                  src="./assets/images/asura-2000-code-eternity.jpg"
                  alt="Asura - Code Eternity (2000)"
                />
              </div>
            </div>
            <div class="slider__slide">
              <div class="image slider__image">
                <img
                  class="image__img"
                  src="./assets/images/asura-2002-lost-eden.jpg"
                  alt="Asura - Lost Eden (2002)"
                />
              </div>
            </div>
            <div class="slider__slide">
              <div class="image slider__image">
                <img
                  class="image__img"
                  src="./assets/images/asura-2007-life-squared.jpg"
                  alt="Asura - Life² (2007)"
                />
              </div>
            </div>
            <div class="slider__slide">
              <div class="image slider__image">
                <img
                  class="image__img"
                  src="./assets/images/asura-2010-360.jpg"
                  alt="Asura - 360 (2010)"
                />
              </div>
            </div>
          </div>
        </div>

        <div class="slider__audio-track-title" aria-live="polite"></div>
        <div class="slider__audio-track-time" aria-hidden="true">
          <div class="slider__audio-track-full-time"></div>
          <div class="slider__audio-track-current-time"></div>
        </div>

        <button
          class="button slider__btn slider__btn--autoscroll-on"
          aria-label="Enable showcase autoscroll loop"
          type="button"
        >
          <svg class="icon" aria-hidden="true">
            <use href="#icon-play"></use>
          </svg>
        </button>

        <button
          class="button slider__btn slider__btn--autoscroll-off js-autoscroll-pause"
          aria-label="Disable showcase autoscroll loop"
          type="button"
        >
          <svg class="icon" aria-hidden="true">
            <use href="#icon-pause"></use>
          </svg>
        </button>

        <div
          class="slider__audio-btns"
          role="group"
          aria-label="Audio deck controller"
        >
          <button
            class="button slider__btn-audio slider__btn-audio--prev js-pressed-target"
            aria-label="Previous audio track"
            type="button"
            tabindex="-1"
          >
            <svg class="icon" aria-hidden="true">
              <use href="#icon-arrow-left"></use>
            </svg>
          </button>

          <button
            class="button slider__btn-audio slider__btn-audio--play js-autoscroll-pause"
            aria-label="Launch audio album playback"
            type="button"
          >
            <svg class="icon" aria-hidden="true">
              <use href="#icon-play"></use>
            </svg>
          </button>

          <button
            class="button slider__btn-audio slider__btn-audio--pause"
            aria-label="Pause audio album playback"
            type="button"
          >
            <svg class="icon" aria-hidden="true">
              <use href="#icon-pause"></use>
            </svg>
          </button>

          <button
            class="button slider__btn-audio slider__btn-audio--next js-pressed-target"
            aria-label="Next audio track"
            type="button"
            tabindex="-1"
          >
            <svg class="icon" aria-hidden="true">
              <use href="#icon-arrow-right"></use>
            </svg>
          </button>
        </div>

        <div
          class="slider__nav"
          role="group"
          aria-label="Showcase slide navigation"
        >
          <button
            class="button slider__btn slider__btn--prev js-autoscroll-pause js-autoscroll-reset js-pressed-target"
            aria-label="Previous slide artwork"
            type="button"
          >
            <svg class="icon" aria-hidden="true">
              <use href="#icon-arrow-left"></use>
            </svg>
          </button>

          <button
            class="button slider__btn slider__btn--next js-autoscroll-pause js-autoscroll-reset js-pressed-target"
            aria-label="Next slide artwork"
            type="button"
          >
            <svg class="icon" aria-hidden="true">
              <use href="#icon-arrow-right"></use>
            </svg>
          </button>
        </div>

        <div
          class="pagination slider__pagination"
          role="group"
          aria-label="Showcase slide pagination dots"
        ></div>

        <a
          class="slider__link-shop js-autoscroll-pause"
          href="https://ultimae.com"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Purchase Asura album"
          >Buy album</a
        >
      </div>
    </div>
    <script src="./script/main.js"></script>
  </body>
</html>
