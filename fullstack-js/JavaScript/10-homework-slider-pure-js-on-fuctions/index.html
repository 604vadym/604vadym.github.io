<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <title>Slider. Pure JavaScript on functions</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="slider">
        <div class="slider__viewport">
          <div class="slider__track">
            <div class="slider__slide">
              <div class="image slider__image">
                <img
                  class="image__img"
                  src="./assets/images/Asura-2000-Code-Eternity.jpg"
                  alt="Asura - Code Eternity (2000)"
                />
              </div>
            </div>
            <div class="slider__slide">
              <div class="image slider__image">
                <img
                  class="image__img"
                  src="./assets/images/Asura-2002-Lost-Eden.jpg"
                  alt="Asura - Lost Eden (2002)"
                />
              </div>
            </div>
            <div class="slider__slide">
              <div class="image slider__image">
                <img
                  class="image__img"
                  src="./assets/images/Asura-2007-Life².jpg"
                  alt="Asura - Life² (2007)"
                />
              </div>
            </div>
            <div class="slider__slide">
              <div class="image slider__image">
                <img
                  class="image__img"
                  src="./assets/images/Asura-2010-360.jpg"
                  alt="Asura - 360 (2010)"
                />
              </div>
            </div>
          </div>
        </div>

        <nav class="slider__nav">
          <button class="button slider__btn slider__btn--prev" type="button">
            <svg aria-hidden="true" viewBox="0 0 1024 1024" role="img">
              <path
                d="M669 172L366 475l303 304q11 11 11 26t-11 25l-95 95q-11 11-25 11t-26-11L99 501q-11-11-11-26t11-25L523 26q11-11 26-11t25 11l95 95q11 10 11 25t-11 26z"
              ></path>
            </svg>
          </button>
          <button class="button slider__btn slider__btn--next" type="button">
            <svg aria-hidden="true" viewBox="0 0 1024 1024" role="img">
              <path
                d="M633 501L209 925q-11 11-26 11t-26-11l-95-95q-11-11-11-25t11-26l304-304L62 172q-11-11-11-26t11-25l95-95q11-11 26-11t26 11l424 424q10 11 10 25t-10 26z"
              ></path>
            </svg>
          </button>

          <div class="slider__pagination"></div>
        </nav>
      </div>
    </div>
    <script src="./script/main.js"></script>
  </body>
</html>
