<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <title>Slider. Pure JavaScript on functions</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="slider">
        <div class="slider__track">
          <div class="slider__slide">
            <div class="image slider__image">
              <img
                class="image__img"
                src="./assets/images/Asura-2000-Code-Eternity.jpg"
                alt="Asura - Code Eternity (2000)"
              />
            </div>
          </div>
          <div class="slider__slide">
            <div class="image slider__image">
              <img
                class="image__img"
                src="./assets/images/Asura-2002-Lost-Eden.jpg"
                alt="Asura - Lost Eden (2002)"
              />
            </div>
          </div>
          <div class="slider__slide">
            <div class="image slider__image">
              <img
                class="image__img"
                src="./assets/images/Asura-2007-Life².jpg"
                alt="Asura - Life² (2007)"
              />
            </div>
          </div>
          <div class="slider__slide">
            <div class="image slider__image">
              <img
                class="image__img"
                src="./assets/images/Asura-2010-360.jpg"
                alt="Asura - 360 (2010)"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./script/main.js"></script>
  </body>
</html>
