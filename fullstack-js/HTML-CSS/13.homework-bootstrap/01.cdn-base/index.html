<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap via cdn</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="text-body-emphasis">
    <div class="container-md text-center vstack gap-2 min-vh-100">
      <header class="row">
        <div class="col">
          <div class="border border-dark-subtle bg-body-secondary">
            <nav class="navbar navbar-expand-lg">
              <div class="container-fluid">
                <a
                  class="navbar-brand p-0 me-5 d-inline-block"
                  href="#"
                  style="height: 50px; width: auto; line-height: 1"
                  ><svg
                    xmlns="http://w3.org"
                    viewBox="0 0 240 120"
                    width="100%"
                    height="100%"
                  >
                    <defs>
                      <linearGradient
                        id="compactGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="0%"
                      >
                        <stop offset="0%" stop-color="#39ff14" />
                        <stop offset="50%" stop-color="#00f0ff" />
                        <stop offset="100%" stop-color="#39ff14" />
                      </linearGradient>
                    </defs>

                    <text
                      x="120"
                      y="105"
                      font-family="'Impact', 'Arial Black', sans-serif"
                      font-size="120"
                      font-weight="900"
                      letter-spacing="2"
                      fill="url(#compactGradient)"
                      stroke="#000000"
                      stroke-width="3"
                      text-anchor="middle"
                    >
                      604
                    </text>
                  </svg></a
                >
                <button
                  class="navbar-toggler"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#navbarNavDropdown"
                  aria-controls="navbarNavDropdown"
                  aria-expanded="false"
                  aria-label="Toggle navigation"
                >
                  <span class="navbar-toggler-icon"></span>
                </button>
                <button type="button" class="btn btn-outline-dark">
                  Login
                </button>
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                  <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                      <a class="nav-link active" aria-current="page" href="#"
                        >Main page</a
                      >
                    </li>
                    <li class="nav-item">
                      <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item dropdown">
                      <a
                        class="nav-link dropdown-toggle"
                        href="#"
                        role="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                      >
                        Dropdown link
                      </a>
                      <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Action1</a></li>
                        <li>
                          <a class="dropdown-item" href="#">Action2</a>
                        </li>
                      </ul>
                    </li>
                    <li class="nav-item dropdown">
                      <a
                        class="nav-link dropdown-toggle"
                        href="#"
                        role="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                      >
                        Dropdown link
                      </a>
                      <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Action1</a></li>
                        <li>
                          <a class="dropdown-item" href="#">Action2</a>
                        </li>
                        <li>
                          <a class="dropdown-item" href="#">Action3</a>
                        </li>
                        <li>
                          <a class="dropdown-item" href="#">Action4</a>
                        </li>
                      </ul>
                    </li>
                  </ul>
                </div>
              </div>
            </nav>
          </div>
        </div>
      </header>

      <div class="row g-2 flex-grow-1">
        <aside class="col-md-4 col-lg">
          <div
            class="border border-dark-subtle bg-body-secondary h-100 d-flex justify-content-center align-items-center"
          >
            LEFT
          </div>
        </aside>

        <main class="col-md-8 col-lg-6">
          <div
            class="border border-dark-subtle bg-body-secondary h-100 d-flex justify-content-center align-items-center"
          >
            MAIN
          </div>
        </main>

        <aside class="col-lg">
          <div
            class="border border-dark-subtle bg-body-secondary h-100 d-flex justify-content-center align-items-center"
          >
            RIGHT
          </div>
        </aside>
      </div>

      <footer class="row">
        <div class="col">
          <div class="py-3 border border-dark-subtle bg-body-secondary">
            FOOTER
          </div>
        </div>
      </footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
