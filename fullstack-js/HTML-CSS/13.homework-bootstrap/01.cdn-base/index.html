<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap via cdn</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container-md text-center vstack gap-2 min-vh-100">
      <div class="row">
        <div class="col">
          <div class="p-3 border border-secondary-subtle bg-body-secondary">
            HEADER
          </div>
        </div>
      </div>

      <div class="row g-2 flex-grow-1">
        <div class="col-md-4 col-lg">
          <div
            class="p-3 border border-secondary-subtle bg-body-secondary h-100 d-flex justify-content-center align-items-center"
          >
            LEFT
          </div>
        </div>
        <div class="col-md-8 col-lg-6">
          <div
            class="p-3 border border-secondary-subtle bg-body-secondary h-100 d-flex justify-content-center align-items-center"
          >
            MAIN
          </div>
        </div>
        <div class="col-lg">
          <div
            class="p-3 border border-secondary-subtle bg-body-secondary h-100 d-flex justify-content-center align-items-center"
          >
            RIGHT
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col">
          <div class="p-3 border border-secondary-subtle bg-body-secondary">
            FOOTER
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
