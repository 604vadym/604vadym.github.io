<!doctype html>
<html lang="en" class="overflow-y-auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./dist/style.css" />
    <title>Tailwind CSS. Layout grid</title>
  </head>
  <body>
    <div class="flex min-h-dvh flex-col gap-2">
      <header class="container shrink-0">
        <div class="border bg-gray-300 py-4 text-center">HEADER</div>
      </header>

      <main
        class="container grid grow grid-cols-1 gap-2 wrap-break-word md:grid-cols-3 lg:grid-cols-4"
      >
        <aside class="flex items-center justify-center border bg-gray-300">
          LEFT
        </aside>

        <section
          class="flex items-center justify-center border bg-gray-300 md:col-span-2"
        >
          MAIN
        </section>

        <aside
          class="flex items-center justify-center border bg-gray-300 md:col-span-3 lg:col-span-1"
        >
          RIGHT
        </aside>
      </main>

      <footer class="container shrink-0">
        <div class="border bg-gray-300 py-4 text-center">FOOTER</div>
      </footer>
    </div>
  </body>
</html>
