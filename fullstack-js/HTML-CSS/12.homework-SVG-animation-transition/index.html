<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/main.css" />
    <title>SVG.Animation.Transition</title>
  </head>
  <body>
    <svg viewBox="0 0 100 100" width="500" height="500">
      <rect
        class="square"
        x="10"
        y="5"
        width="20"
        height="20"
        fill="salmon"
        stroke="green"
        stroke-width="5"
      ></rect>
      <rect
        class="rectangle"
        x="60"
        y="10"
        width="30"
        height="10"
        fill="olive"
        stroke="blue"
        stroke-width="5"
      ></rect>
      <circle
        class="circle"
        cx="50"
        cy="45"
        r="15"
        fill="cornflowerblue"
        stroke="orangered"
        stroke-width="5"
      ></circle>
      <ellipse
        class="ellipse"
        cx="50"
        cy="80"
        rx="25"
        ry="15"
        fill="burlywood"
        stroke="cyan"
        stroke-width="5"
      ></ellipse>
    </svg>
  </body>
</html>
