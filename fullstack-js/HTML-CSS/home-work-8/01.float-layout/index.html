<!doctype html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="./styles/main.css" />
    <title>Float Layout</title>
  </head>
  <body>
    <div class="container">
      <div class="block block-left">Left</div>
      <div class="block block-right">Right</div>
    </div>

    <div class="container">
      <div class="block block-left">Left</div>
      <div class="block block-right">Right 1</div>
      <div class="block block-right">Right 2</div>
      <div class="block block-right">Right 3</div>

    <div class="container">

      <div class="block block-left">Left 2</div>
      <div class="block block-right">Right 1</div>
      <div class="block block-right">Right 2</div>

    <div class="container container-big">

          Right 1 <br />
          div wrapper variant
        </div>
        <div class="block">
          Right 2 <br />
          div wrapper variant
        </div>
      </div>
